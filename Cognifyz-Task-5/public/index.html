<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <h1>Product Management</h1>

        <form id="productForm">
            <input 
            type="hidden"
            id="productId">

            <div class="form-group">
                <label for="name">
                    Product Name
                </label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter product name"
                    required>
            </div>
            <div class="form-group">
                <label for="price">
                    Price
                </label>
                <input
                    type="number"
                    id="price"
                    placeholder="Enter price"
                    required>
            </div>
            <div class="form-group">
                <label for="category">
                    Category
                </label>
                <input
                    type="text"
                    id="category"
                    placeholder="Enter category"
                    required>
            </div>
            <button type="Submit">Save Product</button>
            <button 
            type="button"
            id="cancelBtn"
            class="secondary-btn">
            Cancel Edit
            </button>
            </form>
            <h2>Products</h2>
            <div id="productList"></div>
    </div>
    <script src="/script.js"></script>
    
</body>
</html>
